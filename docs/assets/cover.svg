<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Atmo France integration for Gladys Assistant (illustration,
       not the logo of the Fédération Atmo France). The six arcs use the colors
       of the ATMO index. Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a44"/>
      <stop offset="0.65" stop-color="#1d4f73"/>
      <stop offset="1" stop-color="#2f7a8f"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ff3e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ff3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <circle cx="400" cy="250" r="230" fill="url(#glow)"/>

  <!-- floating particles -->
  <g fill="#d9f6ff" opacity="0.55">
    <circle cx="90" cy="70" r="3"/><circle cx="160" cy="130" r="2"/><circle cx="250" cy="60" r="2.5"/>
    <circle cx="620" cy="80" r="3"/><circle cx="700" cy="150" r="2"/><circle cx="540" cy="40" r="2"/>
    <circle cx="730" cy="60" r="2.5"/><circle cx="60" cy="190" r="2"/><circle cx="330" cy="30" r="2"/>
  </g>

  <!-- ATMO gauge: six arcs, good to extremely poor -->
  <g transform="translate(400 300)" fill="none" stroke-width="30" stroke-linecap="butt">
    <path d="M-180 0 A180 180 0 0 1 -155.9 -90" stroke="#50f0e6"/>
    <path d="M-155.9 -90 A180 180 0 0 1 -90 -155.9" stroke="#50ccaa"/>
    <path d="M-90 -155.9 A180 180 0 0 1 0 -180" stroke="#f0e641"/>
    <path d="M0 -180 A180 180 0 0 1 90 -155.9" stroke="#ff5050"/>
    <path d="M90 -155.9 A180 180 0 0 1 155.9 -90" stroke="#960032"/>
    <path d="M155.9 -90 A180 180 0 0 1 180 0" stroke="#872181"/>
  </g>
  <!-- needle on "fair" -->
  <g transform="translate(400 300) rotate(-52)">
    <path d="M-6 0 L0 -150 L6 0 Z" fill="#ffffff"/>
  </g>
  <circle cx="400" cy="300" r="16" fill="#ffffff"/>
  <circle cx="400" cy="300" r="7" fill="#1d4f73"/>

  <!-- pollen grain and leaf, right -->
  <g transform="translate(640 250)">
    <path d="M0 40 C 40 10, 50 -40, 10 -70 C -30 -40, -40 10, 0 40 Z" fill="#7bd389"/>
    <path d="M0 40 L 6 -55" stroke="#2e7d4f" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(160 240)" fill="#f6d55c">
    <circle r="22"/>
    <g fill="#e2b93b">
      <circle cx="-8" cy="-8" r="4"/><circle cx="8" cy="-6" r="4"/><circle cx="0" cy="8" r="4"/>
      <circle cx="-12" cy="6" r="3"/><circle cx="12" cy="8" r="3"/>
    </g>
  </g>

  <!-- city skyline -->
  <path fill="#0b1f33" d="M0 470 V420 H40 V395 H70 V430 H100 V380 H130 V410 H150 V360 H185 V420
    H215 V400 H240 V440 H270 V390 H300 V420 H330 V370 H350 V350 H362 V330 H368 V350 H380 V420
    H420 V395 H450 V430 H480 V375 H520 V420 H545 V400 H575 V440 H600 V385 H630 V410 H660 V360
    H690 V420 H720 V395 H760 V430 H800 V470 Z"/>
  <rect y="430" width="800" height="104" fill="url(#haze)"/>
  <rect y="470" width="800" height="64" fill="#0b1f33"/>

  <!-- title -->
  <text x="400" y="372" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif"
        font-size="54" font-weight="700" fill="#ffffff">Atmo France</text>
  <text x="400" y="510" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif"
        font-size="24" fill="#cfe9f5">Air quality · Pollen · Pollution episodes</text>
</svg>
